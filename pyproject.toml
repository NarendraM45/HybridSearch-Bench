[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hybridsearch-bench"
version = "1.0.0"
description = "Production-grade RAG pipeline with BM25 + dense vector hybrid retrieval and RAGAS auto-evaluation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["rag", "retrieval", "bm25", "vector-search", "ragas", "llm", "nlp"]

[project.scripts]
hybridsearch = "cli:main"

[tool.setuptools]
py-modules = ["app", "chroma_store", "chunker", "config", "embedder", "evaluation", "exceptions", "ingestion", "interfaces", "logging", "pipeline", "retrieval", "settings", "cli", "metrics", "__init__"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "WARNING"

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN"]

# ── MyPy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
